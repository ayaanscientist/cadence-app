name: cadence
description: "Cadence — Offline-first Android personal operating system."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Database — Drift (SQLite) for offline-first local storage
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # State Management — Riverpod (compile-safe, testable)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Secure Storage — Hardware-backed Android KeyStore
  flutter_secure_storage: ^9.2.2

  # Alarms & Local Notifications
  flutter_local_notifications: ^17.2.2
  android_alarm_manager_plus: ^4.0.4
  timezone: ^0.9.4

  # Audio & Meditation Timer
  just_audio: ^0.9.39
  audio_session: ^0.1.21

  # Local Key-Value Persistence for Alarms & State
  shared_preferences: ^2.3.2

  # File Picker for custom audio alarm sounds
  file_picker: ^8.0.3

  # Utilities
  uuid: ^4.4.2
  equatable: ^2.0.5
  intl: ^0.19.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # AI integration
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Drift code generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

  # Riverpod code generation
  riverpod_generator: ^2.4.3

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/fonts/
